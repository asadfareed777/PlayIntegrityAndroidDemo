org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ---- Play Integrity configuration ----
# Override these in ~/.gradle/gradle.properties or via -P on CI; do not commit real values if you consider them sensitive.
# Google Cloud project NUMBER (not the project ID) linked in Play Console > Test and release > App integrity.
PLAY_INTEGRITY_CLOUD_PROJECT_NUMBER=000000000000
# Base URL of the verification backend in /server. 10.0.2.2 is the host machine as seen from the emulator.
INTEGRITY_BACKEND_URL=http://10.0.2.2:8080/
